spring.application.name=willofthevoid
server.port=${SPRING_DOCKER_PORT:8080}

# Database connection. Hibernate does not create or alter tables; schema changes
# should be applied explicitly through SQL migrations.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wotv}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wotv_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Docker Compose support: when the API runs from the IDE, Spring Boot starts compose.yaml
# (only the database, the backend service needs --profile app) and connects to it.
# start-only leaves the database running when the API stops, so the next start is faster.
spring.docker.compose.lifecycle-management=start-only
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API and JSON conventions
spring.jackson.time-zone=UTC

# OpenAPI / Swagger UI (served by Springdoc)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.horizonglitch.wotv
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Values consumed by the configuration and security layers.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:2592000000}

# Local .env (copied from .env.example): read when the API runs from the IDE, so APP_JWT_SECRET and the
# other variables need no run configuration. Missing in Docker and CI, which pass real environment variables.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Links in the verification and password reset emails point to the frontend.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.tokens.email-verification=24h
app.tokens.password-reset=1h

# Economy (rules/economy.md): every bonus is a multiple of the daily bonus.
# [TBD] daily-bonus and registration-bonus-multiplier are placeholders until the rules set them.
app.economy.daily-bonus=10
app.economy.registration-bonus-multiplier=30
app.economy.comeback-bonus-multiplier=3
app.economy.comeback-absence-days=7
app.economy.comeback-interval-days=30

spring.application.name=willofthevoid
server.port=${SPRING_DOCKER_PORT:8080}

# Database connection. Hibernate does not create or alter tables; schema changes
# should be applied explicitly through SQL migrations.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wotv}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wotv_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Docker Compose support: when the API runs from the IDE, Spring Boot starts compose.yaml
# (only the database, the backend service needs --profile app) and connects to it.
# start-only leaves the database running when the API stops, so the next start is faster.
spring.docker.compose.lifecycle-management=start-only
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API and JSON conventions
spring.jackson.time-zone=UTC

# OpenAPI / Swagger UI (served by Springdoc)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.horizonglitch.wotv
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Values consumed by the configuration and security layers.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:2592000000}

# Local .env (copied from .env.example): read when the API runs from the IDE, so APP_JWT_SECRET and the
# other variables need no run configuration. Missing in Docker and CI, which pass real environment variables.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Links in the verification and password reset emails point to the frontend.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173/play}
app.tokens.email-verification=24h
app.tokens.password-reset=1h

# Economy (rules/economy.md): every bonus is a multiple of the daily bonus.
# Economy values from docs/rules/parameters.md. Every reward is a multiple of DAILY_BONUS.
app.economy.daily-bonus=100
app.economy.registration-bonus-multiplier=6
app.economy.comeback-bonus-multiplier=3
app.economy.comeback-absence-days=7
app.economy.comeback-interval-days=30
app.economy.timezone-change-days=30
app.economy.email-bonus-multiplier=3
app.economy.invite-bonus-multiplier=5
app.economy.orbit-reward-multiplier=2
app.economy.season-reward-orbit1-multiplier=1
app.economy.season-reward-orbit2-multiplier=3
app.economy.season-reward-orbit3-multiplier=6
app.economy.season-reward-orbit4-multiplier=10

# Season rollover (rules/ranking.md, RANK-07 to RANK-09).
app.seasons.length-weeks=4
app.seasons.reset-threshold=1000
app.seasons.reset-check-interval=PT1M

# Deck limits (rules/decks.md). Copy and per-rarity limits are columns of the rarity table.
app.decks.size=30
app.decks.max-per-elemental-faction=15
app.decks.max-saved=20

# Pack guarantees (rules/packs.md, PACK-08 to PACK-10) and the rarities they refer to, by name.
app.packs.champion-packs=10
app.packs.elect-packs=50
app.packs.wanderer-packs=50
app.packs.champion-rarity=Champion
app.packs.elect-rarity=Elect
app.packs.wanderer-rarity=Wanderer

# Trades (rules/trades.md): proposals expire after 48 hours (TRADE_EXPIRY_HOURS); nobody can be left with fewer
# than 30 permanent cards (MIN_COLLECTION_SIZE). The job that expires old proposals runs every minute.
app.trades.expiry=48h
app.trades.min-collection-size=30
app.trades.expiry-check-interval=PT1M

# Match parameters (rules/match.md, rules/parameters.md), passed to the engine. win-threshold-quick and
# end-bonus-per-card are [TEST]. The faction advantages and their value are rows of faction_advantage.
app.battles.win-threshold-friend=30
app.battles.win-threshold-ranked=30
app.battles.win-threshold-quick=20
app.battles.end-bonus-per-card=4
# Trophies (rules/ranking.md, RANK-04): Elo factor ELO_K.
app.battles.elo-k=32
# Challenges expire after 48 hours (CHALLENGE_EXPIRY_HOURS); replays are kept 90 days (REPLAY_RETENTION_DAYS).
app.battles.challenge-expiry=48h
app.battles.replay-retention=90d
app.battles.expiry-check-interval=PT1M
app.battles.replay-cleanup-interval=PT6H

# Matchmaking (rules/game-modes.md): 5 opponents per list, refresh every 5 seconds, Quick opponents active in the
# last 7 days, trophy range by Orbit (1 to 4), attack limits per opponent and shield.
app.matchmaking.list-size=5
app.matchmaking.refresh-cooldown=5s
app.matchmaking.quick-active=7d
app.matchmaking.trophy-ranges=200,150,100,50
app.matchmaking.ranked-attacks-per-opponent=1
app.matchmaking.quick-attacks-per-opponent=3
app.matchmaking.attack-window=24h
app.matchmaking.shield-trigger-attacks=5
app.matchmaking.shield-window=24h
app.matchmaking.shield-duration=12h

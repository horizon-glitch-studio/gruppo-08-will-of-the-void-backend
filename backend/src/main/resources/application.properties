spring.application.name=willofthevoid
server.port=${SPRING_DOCKER_PORT:8080}

# Database connection. Hibernate does not create or alter tables; schema changes
# should be applied explicitly through SQL migrations.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wotv}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wotv_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.locations=filesystem:db
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API and JSON conventions
spring.jackson.time-zone=UTC

# OpenAPI / Swagger UI (served by Springdoc)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.horizonglitch.wotv.controllers
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Values consumed by the configuration and security layers.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:2592000000}

services:
  postgresdb:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./.env
    container_name: wotv_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_LOCAL_PORT}:${POSTGRES_DOCKER_PORT}"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Started only with --profile app, so that Spring Boot's Docker Compose support
    # starts just the database when the API is run from the IDE.
    profiles: ["app"]
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    container_name: wotv_backend
    depends_on:
      postgresdb:
        condition: service_healthy
    env_file: ./.env 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:${POSTGRES_DOCKER_PORT:-5432}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      - DEV_MODE=${DEV_MODE:-true}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_JWT_EXPIRATION_MS=${APP_JWT_EXPIRATION_MS:-900000}
      - APP_JWT_REFRESH_EXPIRATION_MS=${APP_JWT_REFRESH_EXPIRATION_MS:-2592000000}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"

  # JDK 25 and Maven in a container, for anyone without Java installed. Started only with
  # "docker compose run --rm maven ...": the sources are mounted, so it always builds the current code.
  maven:
    profiles: ["tools"]
    image: eclipse-temurin:25-jdk
    working_dir: /workspace
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      # Same settings as the CI: the tests use their own empty database, never the one of postgresdb.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-test:5432/wotv
      - SPRING_DATASOURCE_USERNAME=wotv_user
      - SPRING_DATASOURCE_PASSWORD=wotv_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    command: ["sh", "./mvnw", "--batch-mode", "--no-transfer-progress", "test"]

  # Database of the tests: kept in memory, so every run starts from an empty schema as in the CI.
  postgres-test:
    profiles: ["tools"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wotv
      POSTGRES_USER: wotv_user
      POSTGRES_PASSWORD: wotv_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wotv_user -d wotv"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db:
    driver: local
  maven-cache:
    driver: local

services:
  postgresdb:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./.env
    container_name: wotv_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_LOCAL_PORT}:${POSTGRES_DOCKER_PORT}"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: wotv_backend
    depends_on:
      postgresdb:
        condition: service_healthy
    env_file: ./.env 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:${POSTGRES_DOCKER_PORT:-5432}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      - DEV_MODE=${DEV_MODE:-true}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_JWT_EXPIRATION_MS=${APP_JWT_EXPIRATION_MS:-900000}
      - APP_JWT_REFRESH_EXPIRATION_MS=${APP_JWT_REFRESH_EXPIRATION_MS:-2592000000}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./db:/backend/db:ro
    ports:
      - "${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}"
volumes:
  db:
    driver: local
